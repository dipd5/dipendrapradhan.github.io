<!DOCTYPE html>
<html>
<head>
    <title>Dipendra Pradhan Photography</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body{
            margin:0;
            font-family:Arial,sans-serif;
            background:#111;
            color:white;
        }
        header{
            text-align:center;
            padding:80px 20px;
        }
        h1{
            font-size:3rem;
            margin:0;
        }
        p{
            color:#ccc;
        }
        .gallery{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
            gap:15px;
            padding:20px;
        }
        .gallery img{
            width:100%;
            height:300px;
            object-fit:cover;
            border-radius:10px;
        }
        footer{
            text-align:center;
            padding:30px;
            color:#999;
        }
    </style>
</head>
<body>

<header>
    <h1>Dipendra Pradhan</h1>
    <p>Photography Portfolio</p>
</header>

<section class="gallery">
    <img src="https://picsum.photos/800/600?1">
    <img src="https://picsum.photos/800/600?2">
    <img src="https://picsum.photos/800/600?3">
    <img src="https://picsum.photos/800/600?4">
    <img src="https://picsum.photos/800/600?5">
    <img src="https://picsum.photos/800/600?6">
</section>

<footer>
    © 2026 Dipendra Pradhan
</footer>

</body>
</html>
